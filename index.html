<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File Converter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#2f6b4f;--acx:#fff;--bd:#e2e0d8;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--tx:#f0efe9;--mut:#a09f97;--ac:#6fbf97;--acx:#10231a;--bd:#38372f;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Ethiopic",Kefa,Nyala,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.opt{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.opt b{display:block;font-size:.95rem}.opt span{font-size:.8rem;color:var(--mut)}
.opt.on{border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
textarea{width:100%;min-height:160px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:22px 12px;text-align:center;color:var(--mut);cursor:pointer}
.drop input{display:none}.drop b{color:var(--tx);word-break:break-all}
button.go,button.sv{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
button:disabled{opacity:.5}
#st{margin-top:12px;font-size:.92rem;min-height:1.4em}#st.e{color:var(--err)}
.note{color:var(--mut);font-size:.8rem;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>📄 File Converter</h1>
<p class="s">Works offline. Your files never leave your device.</p>
<div class="grid" id="opts"></div>
<div class="box">
<div id="inp"></div>
<button class="go" id="go">Convert</button>
<div id="st"></div>
<button class="sv" id="sv" hidden>💾 Download</button>
</div>
<p class="note">Note: only text is converted. Images, tables and complex layouts may not be preserved. Scanned PDFs can’t be read.</p>
</main>
<script>
var MODES={
 pdf2word:{t:"PDF → Word",d:".pdf",acc:".pdf",ext:"docx"},
 word2pdf:{t:"Word → PDF",d:".docx",acc:".docx",ext:"pdf"},
 text2word:{t:"Text → Word",d:"Type or .txt",acc:".txt,text/plain",ext:"docx",text:true},
 word2ppt:{t:"Word → PowerPoint",d:".docx",acc:".docx",ext:"pptx"}
};
var LIBS={docx:{g:"docx",u:"lib/docx.js"},pptx:{g:"PptxGenJS",u:"lib/pptxgen.js"},jszip:{g:"JSZip",u:"lib/jszip.js"},pdflib:{g:"PDFLib",u:"lib/pdf-lib.js"}};
var NEED={pdf2word:["docx"],word2pdf:["jszip","pdflib"],text2word:["docx"],word2ppt:["jszip","pptx"]};
var mode="pdf2word",file=null,out=null,outName="";
var $=function(i){return document.getElementById(i)};
var FONT='system-ui,"Noto Sans Ethiopic",Kefa,Nyala,"Abyssinica SIL",sans-serif';

function lib(k){var L=LIBS[k];if(window[L.g])return Promise.resolve();
 return new Promise(function(res,rej){var s=document.createElement("script");s.onload=res;s.onerror=function(){rej(new Error("Could not load "+k+". Open the app once while online so it can be saved."))};s.src=L.u;document.head.appendChild(s)})}
function renderOpts(){
 $("opts").innerHTML="";
 Object.keys(MODES).forEach(function(k){
  var b=document.createElement("button");b.className="opt"+(k===mode?" on":"");
  b.innerHTML="<b>"+MODES[k].t+"</b><span>"+MODES[k].d+"</span>";
  b.onclick=function(){mode=k;file=null;reset();renderOpts();renderInput()};
  $("opts").appendChild(b);
 });
}
function renderInput(){
 var m=MODES[mode],h="";
 if(m.text)h+='<textarea id="tx" placeholder="Type or paste your text here…"></textarea><div style="margin:10px 0;color:var(--mut);text-align:center">or</div>';
 h+='<label class="drop"><input type="file" id="fi" accept="'+m.acc+'"><span id="fn">'+(m.text?"Choose a .txt file":"Choose a "+m.d+" file")+'</span></label>';
 $("inp").innerHTML=h;
 $("fi").onchange=function(e){file=e.target.files[0]||null;$("fn").innerHTML=file?"<b></b>":"";if(file)$("fn").firstChild.textContent=file.name;reset()};
}
function reset(){out=null;$("sv").hidden=true;msg("")}
function msg(t,e){$("st").textContent=t;$("st").className=e?"e":""}
function base(n){return n.replace(/\.[^.]+$/,"")||"file"}
function readBuf(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsArrayBuffer(f)})}
function readTxt(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsText(f)})}

function textToDocx(lines){
 var D=window.docx;
 var paras=lines.map(function(l){return new D.Paragraph({children:[new D.TextRun({text:l,font:"Nyala",size:24})],spacing:{after:120}})});
 return D.Packer.toBlob(new D.Document({sections:[{children:paras}]}));
}
async function readDocx(f){
 var z=await JSZip.loadAsync(await readBuf(f)),e=z.file("word/document.xml");
 if(!e)throw new Error("This doesn't look like a .docx file.");
 var xml=new DOMParser().parseFromString(await e.async("string"),"application/xml");
 var ps=xml.getElementsByTagName("w:p"),res=[];
 for(var i=0;i<ps.length;i++){
  var p=ps[i],all=p.getElementsByTagName("*"),t="";
  for(var j=0;j<all.length;j++){var n=all[j].nodeName;if(n==="w:t")t+=all[j].textContent;else if(n==="w:tab")t+="\t";else if(n==="w:br")t+="\n"}
  var st=p.getElementsByTagName("w:pStyle")[0],sv=st?st.getAttribute("w:val")||"":"";
  res.push({h:/^(heading|title)/i.test(sv),li:p.getElementsByTagName("w:numPr").length>0,t:t.trim()});
 }
 return res;
}

async function pdfToWord(f){
 var pdfjs=await import("./lib/pdf.min.mjs");
 pdfjs.GlobalWorkerOptions.workerSrc="./lib/pdf.worker.min.mjs";
 var pdf=await pdfjs.getDocument({data:new Uint8Array(await readBuf(f))}).promise,lines=[];
 for(var p=1;p<=pdf.numPages;p++){
  msg("Reading page "+p+" of "+pdf.numPages+"…");
  var c=await (await pdf.getPage(p)).getTextContent(),cur="",y=null;
  c.items.forEach(function(it){
   if(typeof it.str!=="string")return;
   var yy=Math.round(it.transform[5]);
   if(y!==null&&Math.abs(yy-y)>3){if(cur.trim())lines.push(cur.trim());cur=""}
   cur+=it.str+(it.hasEOL?" ":"");y=yy;
  });
  if(cur.trim())lines.push(cur.trim());
  lines.push("");
 }
 if(!lines.join("").trim())throw new Error("No text found in this PDF (it may be scanned).");
 return textToDocx(lines);
}

async function wordToPdf(f){
 var paras=await readDocx(f),raw=paras.map(function(p){return (p.li&&p.t?"• ":"")+p.t}).join("\n");
 if(!raw.trim())throw new Error("The file is empty.");
 var W=1190,H=1684,M=110,FS=26,LH=42,cv=document.createElement("canvas");
 cv.width=W;cv.height=H;var x=cv.getContext("2d");
 var pdf=await PDFLib.PDFDocument.create(),pages=[],y=0;
 function page(){x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.font=FS+"px "+FONT;x.textBaseline="top";y=M}
 function flush(){
  var b=atob(cv.toDataURL("image/jpeg",.9).split(",")[1]),u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);pages.push(u);
 }
 page();
 raw.split("\n").forEach(function(par){
  var words=par.split(/(\s+)/),line="";
  function put(s){if(y+LH>H-M){flush();page()}x.fillText(s,M,y);y+=LH}
  words.forEach(function(w){
   var t=line+w;
   if(x.measureText(t).width>W-2*M&&line.trim()){put(line.trim());line=w.replace(/^\s+/,"")}else line=t;
   while(x.measureText(line).width>W-2*M){
    var n=line.length;while(n>1&&x.measureText(line.slice(0,n)).width>W-2*M)n--;
    put(line.slice(0,n));line=line.slice(n);
   }
  });
  put(line.trim());
 });
 flush();
 for(var i=0;i<pages.length;i++){
  var im=await pdf.embedJpg(pages[i]),pg=pdf.addPage([595.28,841.89]);
  pg.drawImage(im,{x:0,y:0,width:595.28,height:841.89});
 }
 return new Blob([await pdf.save()],{type:"application/pdf"});
}

async function textToWord(){
 var t=$("tx").value;
 if(file)t=await readTxt(file);
 if(!t.trim())throw new Error("Type some text or choose a file.");
 return textToDocx(t.split(/\r?\n/));
}

async function wordToPpt(f){
 var paras=await readDocx(f),slides=[],cur=null;
 paras.forEach(function(p){
  if(!p.t)return;
  if(p.h||!cur){cur={title:p.h?p.t:"",body:[]};slides.push(cur);if(p.h)return}
  cur.body.push(p.t);
  if(cur.body.join("").length>650){cur={title:"",body:[]};slides.push(cur)}
 });
 slides=slides.filter(function(s){return s.title||s.body.length});
 if(!slides.length)throw new Error("The file is empty.");
 var pp=new PptxGenJS();pp.layout="LAYOUT_16x9";
 slides.forEach(function(s,i){
  var sl=pp.addSlide();
  sl.addText(s.title||"Slide "+(i+1),{x:.5,y:.3,w:9,h:.9,fontSize:28,bold:true,fontFace:"Nyala",color:"1D1D1B"});
  if(s.body.length)sl.addText(s.body.map(function(b){return{text:b,options:{bullet:true,breakLine:true}}}),{x:.5,y:1.3,w:9,h:4,fontSize:18,fontFace:"Nyala",valign:"top",color:"333333",fit:"shrink"});
 });
 return pp.write({outputType:"blob"});
}

$("go").onclick=async function(){
 var m=MODES[mode];reset();
 if(!m.text&&!file){msg("Please choose a file first.",true);return}
 $("go").disabled=true;msg("Converting…");
 try{
  for(var q=0;q<NEED[mode].length;q++)await lib(NEED[mode][q]);
  var fn={pdf2word:pdfToWord,word2pdf:wordToPdf,text2word:textToWord,word2ppt:wordToPpt}[mode];
  out=await fn(file);
  outName=(file?base(file.name):"text")+"."+m.ext;
  msg("✅ Done: "+outName);$("sv").hidden=false;
 }catch(e){msg("Error: "+(e&&e.message?e.message:e),true)}
 $("go").disabled=false;
};
$("sv").onclick=function(){
 var a=document.createElement("a");a.href=URL.createObjectURL(out);a.download=outName;
 document.body.appendChild(a);a.click();a.remove();msg("✅ Saved");
};
renderOpts();renderInput();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
